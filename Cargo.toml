[workspace]
members = [".", "examples/folder-pay"]
resolver = "2"

[package]
name = "indexer-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "=25.3.1", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "=25.3.1", features = ["testutils"] }

[workspace.dependencies]
soroban-sdk = { version = "=25.3.1", features = ["alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
