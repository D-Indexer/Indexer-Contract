[workspace]
members = [".", "tools/ledger-keys"]

[package]
name = "indexer-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exposes the storage `DataKey` type to off-chain tooling (tools/ledger-keys).
lib = []

[dependencies]
soroban-sdk = { version = "=25.3.1", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "=25.3.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
