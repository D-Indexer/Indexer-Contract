[package]
name = "indexer-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The `alloc` feature is required: the contract stores and returns `String`
# values (folder names, IPFS CIDs, metadata URIs) and `Vec<Address>` admin
# lists, which need the SDK's alloc-backed types. Removing it does not build.
soroban-sdk = { version = "=25.3.1", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "=25.3.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
