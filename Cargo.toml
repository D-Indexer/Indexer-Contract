[package]
name = "indexer-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=29.0.1", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }

[workspace]
# Spike (#249): the monolith split into three cross-calling contracts.
members = [".", "spike/folder-registry", "spike/folder-templates", "spike/folder-portfolio"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
