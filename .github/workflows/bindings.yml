name: TypeScript bindings

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  STELLAR_CLI_VERSION: 28.1.0
  NODE_VERSION: 20.18.0

jobs:
  bindings:
    name: generate / build / smoke-test bindings
    runs-on: ubuntu-latest
    permissions:
      contents: write # release asset upload
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build optimized wasm
        run: make build-optimized

      - name: Generate bindings (defaults from deployments/testnet.json)
        run: make bindings

      - name: Build bindings
        working-directory: bindings/ts
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build

      - name: Smoke test
        run: node scripts/tests/bindings-smoke.mjs bindings/ts

      - name: Pack
        working-directory: bindings/ts
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: indexer-contract-bindings-ts
          path: bindings/ts/*.tgz
          if-no-files-found: error

      - name: Attach tarball to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" bindings/ts/*.tgz --clobber
