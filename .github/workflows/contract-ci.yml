name: Soroban Contract CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: make fmt-check

      - name: Run cargo check
        run: make cargo-check

      - name: Run clippy
        run: make clippy

      - name: Run tests
        run: make test

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM
        run: make build-wasm

      - name: Install Stellar CLI native dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config build-essential

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Optimize WASM
        run: make optimize-wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: indexer_contract.optimized.wasm
          path: target/wasm32v1-none/release/indexer_contract.optimized.wasm
