name: Soroban Contract CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run the testnet smoke test against deployments/testnet.json
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 28.1.0

jobs:
  checks:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Shell script syntax
        run: make script-check

      - name: Template CIDs match committed files
        run: python3 scripts/template_cids.py --check

      - name: Mainnet preflight check tests (mocked)
        run: make preflight-test

  wasm:
    name: optimized wasm build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/stellar" --version

      - name: Build optimized wasm
        run: make build-optimized

      - name: Report wasm hash
        run: |
          HASH="$(sha256sum target/stellar/indexer_contract.wasm | cut -d' ' -f1)"
          DEPLOYED="$(jq -r .wasm_hash deployments/testnet.json)"
          {
            echo "### Optimized wasm"
            echo "- sha256 / wasm hash: \`$HASH\`"
            echo "- testnet deployment: \`$DEPLOYED\`"
            if [[ "$HASH" == "$DEPLOYED" ]]; then
              echo "- ✅ matches the deployed testnet wasm"
            else
              echo "- ℹ️ differs from the deployed testnet wasm (expected if src/ changed since deploy)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: indexer_contract-wasm
          path: target/stellar/indexer_contract.wasm
          if-no-files-found: error

  # Deploys to a local quickstart network, then drives the deployment through
  # the generated TypeScript bindings. One job, because the network only lives
  # as long as the runner; the deployment record is uploaded as an artifact.
  local-e2e:
    name: local network deploy + TypeScript e2e
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start local network (stellar/quickstart)
        run: docker run -d --name stellar -p 8000:8000 stellar/quickstart:latest --local --enable core,rpc,horizon,friendbot

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/ts-e2e/package-lock.json

      - name: Wait for RPC and Friendbot
        run: |
          for _ in $(seq 120); do
            # Friendbot answers 400 (missing addr) once it is up.
            [[ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/friendbot)" == 400 ]] \
              && curl -sf -X POST localhost:8000/rpc -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -q healthy \
              && exit 0
            sleep 2
          done
          docker logs stellar | tail -50
          exit 1

      - name: Deploy to local network
        run: STELLAR_IDENTITY=local-deployer ./scripts/deploy.sh local

      - name: Upload local deployment record
        uses: actions/upload-artifact@v4
        with:
          name: local-deployment
          path: deployments/local.json

      - name: Generate TypeScript bindings
        working-directory: clients/ts-e2e
        run: npm run bindings

      - name: TypeScript e2e suite
        working-directory: clients/ts-e2e
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  smoke-testnet:
    name: testnet smoke test
    runs-on: ubuntu-latest
    needs: wasm
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke
    steps:
      - uses: actions/checkout@v4

      - name: Install Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/stellar" --version

      # Uses a fresh Friendbot-funded identity, so no secrets are required.
      - name: Run smoke test
        run: |
          SMOKE_MARKDOWN=1 ./scripts/smoke-testnet.sh | tee smoke.md
          { echo "### Testnet smoke run"; cat smoke.md; } >> "$GITHUB_STEP_SUMMARY"
