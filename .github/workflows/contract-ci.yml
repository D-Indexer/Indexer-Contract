name: Soroban Contract CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run the testnet smoke test against deployments/testnet.json
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 28.1.0

jobs:
  checks:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Shell script syntax
        run: make script-check

      - name: Template CIDs match committed files
        run: python3 scripts/template_cids.py --check

  wasm:
    name: optimized wasm build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/stellar" --version

      - name: Build optimized wasm
        run: make build-optimized

      - name: Report wasm hash
        run: |
          HASH="$(sha256sum target/stellar/indexer_contract.wasm | cut -d' ' -f1)"
          DEPLOYED="$(jq -r .wasm_hash deployments/testnet.json)"
          {
            echo "### Optimized wasm"
            echo "- sha256 / wasm hash: \`$HASH\`"
            echo "- testnet deployment: \`$DEPLOYED\`"
            if [[ "$HASH" == "$DEPLOYED" ]]; then
              echo "- ✅ matches the deployed testnet wasm"
            else
              echo "- ℹ️ differs from the deployed testnet wasm (expected if src/ changed since deploy)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: indexer_contract-wasm
          path: target/stellar/indexer_contract.wasm
          if-no-files-found: error

  smoke-testnet:
    name: testnet smoke test
    runs-on: ubuntu-latest
    needs: wasm
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke
    steps:
      - uses: actions/checkout@v4

      - name: Install Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/stellar" --version

      # Uses a fresh Friendbot-funded identity, so no secrets are required.
      - name: Run smoke test
        run: |
          SMOKE_MARKDOWN=1 ./scripts/smoke-testnet.sh | tee smoke.md
          { echo "### Testnet smoke run"; cat smoke.md; } >> "$GITHUB_STEP_SUMMARY"
