name: Soroban Contract CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run the testnet smoke test against deployments/testnet.json
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Keep version and sha256 in lockstep (x86_64-unknown-linux-gnu tarball,
  # 26427814 bytes). Pinned here, never fetched from the release.
  STELLAR_CLI_VERSION: 28.1.0
  STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462

jobs:
  checks:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: host-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          cache-targets: true
          cache-all-crates: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Shell script syntax and shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make script-check
          shellcheck scripts/deploy.sh

      - name: errors.json matches src/errors.rs
        run: |
          python3 scripts/test_errors_json.py
          python3 scripts/errors_json.py --check

      - name: Template CIDs match committed files
        run: python3 scripts/template_cids.py --check

      - name: Deployment records match deployments/schema.json
        run: python3 scripts/validate_deployments.py

      - name: Script unit tests (TTL monitor, deploy.sh with mocked stellar, schema, ledger backfill)
        run: python3 -m unittest discover -s scripts/tests

  supply-chain:
    name: cargo-deny / renovate config / workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check advisories bans licenses sources

      - name: Validate Renovate config
        run: npx --yes -p renovate@44.256.1 renovate-config-validator --strict

      - name: Actions pinned by SHA and permissions declared
        run: ./scripts/check-workflows.sh

      - name: zizmor (fail on high findings)
        run: pipx run zizmor==1.32.0 --min-severity high .github/workflows

  wasm:
    name: optimized wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: wasm32v1-none-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          cache-targets: true
          cache-all-crates: true

      - name: Install Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          ./scripts/install-stellar-cli.sh "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build optimized wasm
        run: |
          START="$(date +%s)"
          make build-optimized
          ELAPSED="$(( $(date +%s) - START ))"
          echo "WASM_BUILD_SECONDS=$ELAPSED" >> "$GITHUB_ENV"
          echo "- optimized wasm build: ${ELAPSED}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert and report build metadata
        run: |
          META="$(stellar contract info meta --wasm target/stellar/indexer_contract.wasm)"
          echo "$META"
          echo "$META" | grep -Fq "source_repo"
          echo "$META" | grep -Fq "github:D-Indexer/Indexer-Contract"
          {
            echo "### Contract build metadata"
            echo '```text'
            echo "$META"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report wasm hash
        run: |
          HASH="$(sha256sum target/stellar/indexer_contract.wasm | cut -d' ' -f1)"
          DEPLOYED="$(jq -r .wasm_hash deployments/testnet.json)"
          {
            echo "### Optimized wasm"
            echo "- sha256 / wasm hash: \`$HASH\`"
            echo "- testnet deployment: \`$DEPLOYED\`"
            if [[ "$HASH" == "$DEPLOYED" ]]; then
              echo "- ✅ matches the deployed testnet wasm"
            else
              echo "- ℹ️ differs from the deployed testnet wasm (expected if src/ changed since deploy)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wasm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: indexer_contract-wasm
          path: target/stellar/indexer_contract.wasm
          if-no-files-found: error

  smoke-testnet:
    name: testnet smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: wasm
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          ./scripts/install-stellar-cli.sh "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Uses a fresh Friendbot-funded identity, so no secrets are required.
      - name: Run smoke test
        run: |
          SMOKE_MARKDOWN=1 ./scripts/smoke-testnet.sh | tee smoke.md
          { echo "### Testnet smoke run"; cat smoke.md; } >> "$GITHUB_STEP_SUMMARY"
